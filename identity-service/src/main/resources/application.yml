spring:
  application:
    name: identity-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${IDENTITY_DB_URL}
    username: ${IDENTITY_DB_USERNAME}
    password: ${IDENTITY_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: identity
  flyway:
    schemas: identity
    default-schema: identity
    create-schemas: false

server:
  port: 8080
